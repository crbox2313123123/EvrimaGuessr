<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVRIHATCH • Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Press Start 2P', system-ui; background: #0a0a1f; color: #0f0; height: 100vh; display: flex; flex-direction: column; }
        header { background: #111133; padding: 20px; text-align: center; border-bottom: 4px solid #0f0; }
    </style>
</head>
<body>
    <header>
        <img src="mobilebanner.png" alt="EVRIHATCH" style="max-height:54px; image-rendering:pixelated;">
        <p class="text-xs mt-3 text-[#0f0]">LOG IN TO RAISE YOUR DINO</p>
    </header>

    <div class="flex-1 flex items-center justify-center flex-col gap-8">
        <button onclick="loginWithProvider('google')" class="w-80 py-6 border-4 border-[#4285F4] bg-[#4285F4] text-white text-xl">🔵 LOGIN WITH GOOGLE</button>
        <button onclick="loginWithProvider('discord')" class="w-80 py-6 border-4 border-[#5865F2] bg-[#5865F2] text-white text-xl">🐙 LOGIN WITH DISCORD</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://cgufpeetcjywisqvhqlk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_lsNrJO_6cRlkTMPz7PkLzw_yQCwj0ig';

        let supabaseClient;

        function getReturnTo() {
            const params = new URLSearchParams(window.location.search);
            return params.get('returnTo') || 'evrihatch.html';
        }

        async function initLogin() {
            const { createClient } = supabase;
            supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session?.user) {
                window.location.href = getReturnTo();
            }
        }

        function loginWithProvider(provider) {
            const returnTo = getReturnTo();
            supabaseClient.auth.signInWithOAuth({
                provider: provider,
                options: { redirectTo: window.location.origin + '/' + returnTo }
            });
        }

        window.onload = initLogin;
    </script>
</body>
</html>
