<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVRIHATCH • The Isle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Press Start 2P', system-ui; background: #0a0a1f; color: #0f0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        header { background: #111133; padding: 10px 12px; text-align: center; border-bottom: 4px solid #0f0; box-shadow: 0 0 20px #0f0; }
        #mobile-header-banner { max-height: 54px; image-rendering: pixelated; }
    </style>
</head>
<body>
    <header>
        <img id="mobile-header-banner" src="mobilebanner.png" alt="EVRIHATCH">
        <p id="player-name" class="text-xs mt-1 text-[#0f0]">CONNECTING...</p>
    </header>

    <div id="login-screen" class="flex-1 flex items-center justify-center flex-col gap-8">
        <h2 class="text-3xl text-[#0f0] tracking-widest">EVRIHATCH</h2>
        <button onclick="loginWithProvider('google')" class="w-80 py-5 border-4 border-[#4285F4] bg-[#4285F4] text-white text-lg">🔵 LOGIN WITH GOOGLE</button>
        <button onclick="loginWithProvider('discord')" class="w-80 py-5 border-4 border-[#5865F2] bg-[#5865F2] text-white text-lg">🐙 LOGIN WITH DISCORD</button>
        <p id="login-error" class="text-red-500 text-sm mt-4 hidden"></p>
    </div>

    <div id="hub-screen" class="flex-1 flex overflow-hidden flex-col md:flex-row hidden"> ... (same hub as before) ... </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://cgufpeetcjywisqvhqlk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_lsNrJO_6cRlkTMPz7PkLzw_yQCwj0ig';

        let supabaseClient;

        async function init() {
            const { createClient } = supabase;
            supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const { data: { session } } = await supabaseClient.auth.getSession();

            if (session?.user) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('hub-screen').classList.remove('hidden');
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
            }
        }

        function loginWithProvider(provider) {
            document.getElementById('login-error').classList.add('hidden');
            supabaseClient.auth.signInWithOAuth({
                provider: provider,
                options: { redirectTo: window.location.origin + window.location.pathname }
            }).catch(err => {
                console.error(err);
                const errEl = document.getElementById('login-error');
                errEl.textContent = "Login failed: " + err.message;
                errEl.classList.remove('hidden');
            });
        }

        window.onload = init;
    </script>
</body>
</html>
